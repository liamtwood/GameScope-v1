<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eagle Logo Background Remover</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .upload-area {
            border: 3px dashed #ddd;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: #fafafa;
        }
        
        .upload-area:hover {
            border-color: #667eea;
            background: #f5f5ff;
        }
        
        .upload-area.dragover {
            border-color: #667eea;
            background: #f0f0ff;
        }
        
        .upload-icon {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .upload-text {
            color: #666;
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        .upload-hint {
            color: #999;
            font-size: 13px;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .preview-section {
            display: none;
            margin-top: 30px;
        }
        
        .preview-section.active {
            display: block;
        }
        
        .preview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 600px) {
            .preview-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .preview-box {
            text-align: center;
        }
        
        .preview-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .preview-image {
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 10px;
            background: #f8f8f8;
            position: relative;
            overflow: hidden;
        }
        
        .preview-image.checkerboard {
            background-image: 
                linear-gradient(45deg, #ddd 25%, transparent 25%),
                linear-gradient(-45deg, #ddd 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #ddd 75%),
                linear-gradient(-45deg, transparent 75%, #ddd 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        
        canvas {
            max-width: 100%;
            height: auto;
            display: block;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .processing {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-weight: 600;
        }
        
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦅 Eagle Logo Background Remover</h1>
        <div class="description">Upload your eagle logo to remove the background while preserving internal white areas</div>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">Drop your image here or click to browse</div>
            <div class="upload-hint">Supports PNG, JPG, JPEG formats</div>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        
        <div class="preview-section" id="previewSection">
            <div class="preview-grid">
                <div class="preview-box">
                    <div class="preview-label">Original Image</div>
                    <div class="preview-image">
                        <canvas id="originalCanvas"></canvas>
                    </div>
                </div>
                <div class="preview-box">
                    <div class="preview-label">Background Removed</div>
                    <div class="preview-image checkerboard">
                        <canvas id="processedCanvas"></canvas>
                    </div>
                </div>
            </div>
            
            <div class="controls">
                <button class="btn btn-primary" id="downloadBtn">
                    💾 Download PNG
                </button>
                <button class="btn btn-secondary" id="resetBtn">
                    🔄 Process Another Image
                </button>
            </div>
        </div>
        
        <div class="processing" id="processing" style="display: none;">
            <div class="loader"></div>
            Processing your image...
        </div>
    </div>
    
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const originalCanvas = document.getElementById('originalCanvas');
        const processedCanvas = document.getElementById('processedCanvas');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const processing = document.getElementById('processing');
        
        // Upload handling
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });
        
        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('Please upload an image file');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    processImage(img);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
        
        function processImage(img) {
            // Show processing indicator
            uploadArea.style.display = 'none';
            processing.style.display = 'block';
            
            // Set canvas dimensions
            originalCanvas.width = img.width;
            originalCanvas.height = img.height;
            processedCanvas.width = img.width;
            processedCanvas.height = img.height;
            
            // Draw original
            const origCtx = originalCanvas.getContext('2d');
            origCtx.drawImage(img, 0, 0);
            
            // Process image
            const procCtx = processedCanvas.getContext('2d');
            procCtx.drawImage(img, 0, 0);
            
            // Get image data
            const imageData = procCtx.getImageData(0, 0, img.width, img.height);
            const data = imageData.data;
            
            // Find background color (sample corners)
            const corners = [
                0, // top-left
                (img.width - 1) * 4, // top-right
                (img.height - 1) * img.width * 4, // bottom-left
                ((img.height - 1) * img.width + img.width - 1) * 4 // bottom-right
            ];
            
            let bgR = 0, bgG = 0, bgB = 0;
            let count = 0;
            
            for (let corner of corners) {
                // Check if corner is predominantly white/light
                if (data[corner] > 200 && data[corner + 1] > 200 && data[corner + 2] > 200) {
                    bgR += data[corner];
                    bgG += data[corner + 1];
                    bgB += data[corner + 2];
                    count++;
                }
            }
            
            if (count > 0) {
                bgR = Math.round(bgR / count);
                bgG = Math.round(bgG / count);
                bgB = Math.round(bgB / count);
            } else {
                // Default to white if no clear background found
                bgR = bgG = bgB = 255;
            }
            
            // Create a flood fill mask for external background
            const visited = new Array(img.width * img.height).fill(false);
            const queue = [];
            
            // Add corners to queue
            const cornerPositions = [
                {x: 0, y: 0},
                {x: img.width - 1, y: 0},
                {x: 0, y: img.height - 1},
                {x: img.width - 1, y: img.height - 1}
            ];
            
            // Tolerance for color matching
            const tolerance = 30;
            
            function colorMatch(idx) {
                const r = data[idx];
                const g = data[idx + 1];
                const b = data[idx + 2];
                return Math.abs(r - bgR) < tolerance && 
                       Math.abs(g - bgG) < tolerance && 
                       Math.abs(b - bgB) < tolerance;
            }
            
            // Start flood fill from corners
            for (let corner of cornerPositions) {
                const idx = corner.y * img.width + corner.x;
                const pixelIdx = idx * 4;
                if (colorMatch(pixelIdx)) {
                    queue.push(corner);
                    visited[idx] = true;
                }
            }
            
            // Flood fill to find external background
            while (queue.length > 0) {
                const {x, y} = queue.shift();
                
                // Check neighbors
                const neighbors = [
                    {x: x - 1, y: y},
                    {x: x + 1, y: y},
                    {x: x, y: y - 1},
                    {x: x, y: y + 1}
                ];
                
                for (let neighbor of neighbors) {
                    if (neighbor.x >= 0 && neighbor.x < img.width && 
                        neighbor.y >= 0 && neighbor.y < img.height) {
                        const idx = neighbor.y * img.width + neighbor.x;
                        const pixelIdx = idx * 4;
                        
                        if (!visited[idx] && colorMatch(pixelIdx)) {
                            visited[idx] = true;
                            queue.push(neighbor);
                        }
                    }
                }
            }
            
            // Apply transparency to background pixels only
            for (let y = 0; y < img.height; y++) {
                for (let x = 0; x < img.width; x++) {
                    const idx = y * img.width + x;
                    const pixelIdx = idx * 4;
                    
                    if (visited[idx]) {
                        // This is external background - make transparent
                        data[pixelIdx + 3] = 0;
                    }
                }
            }
            
            // Put processed image data back
            procCtx.putImageData(imageData, 0, 0);
            
            // Show results
            setTimeout(() => {
                processing.style.display = 'none';
                previewSection.classList.add('active');
            }, 500);
        }
        
        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'eagle-logo-transparent.png';
            link.href = processedCanvas.toDataURL();
            link.click();
        });
        
        resetBtn.addEventListener('click', () => {
            previewSection.classList.remove('active');
            uploadArea.style.display = 'block';
            fileInput.value = '';
        });
        
        // Auto-process the image if it's embedded
        window.addEventListener('load', () => {
            // For the uploaded image, we'll need the user to upload it
            // since we can't access the image directly from the conversation
        });
    </script>
</body>
</html>
