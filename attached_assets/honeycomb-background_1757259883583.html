<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honeycomb Pattern</title>
<style>
/* CSS Variables matching SCSS variables */
:root {
  --cell-size: 12vw;
  --columns: 6;
  --gap: 0.3vw;
  --cell-height: calc(var(--cell-size) * 1.15);
  --container-width: calc((var(--cell-size) + var(--gap)) * var(--columns));
  --row-height: calc(var(--cell-size) * 0.8666);
  --margin-offset: calc(var(--cell-size) / 2 + var(--gap) / 2);
}

body {
  background: darkorange;
  font-family: sans-serif;
  color: orangered;
  margin: 0;
  padding: 20px;
}

.honeycomb {
  display: grid;
  width: var(--container-width);
  margin: 0 auto;
  transform: translateX(calc(var(--margin-offset) / -2));
  grid-template-columns: repeat(6, minmax(var(--cell-size), 1fr));
  grid-auto-rows: var(--row-height);
  gap: var(--gap);
}

.cell {
  width: var(--cell-size);
  height: var(--cell-height);
  margin: 0;
  background-color: white;
  clip-path: polygon(
    50% 0%, 
    100% 25%, 
    100% 75%, 
    50% 100%, 
    0% 75%, 
    0% 25%
  );
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  text-align: center;
}

.cell p {
  margin: 1em;
}

/* Staggering cells - converted from SCSS @for loop */
/* For 6 columns: cells 7-12, 19-24, 31-36, etc. get offset */
.cell:nth-child(12n + 7),
.cell:nth-child(12n + 8),
.cell:nth-child(12n + 9),
.cell:nth-child(12n + 10),
.cell:nth-child(12n + 11),
.cell:nth-child(12n + 12) {
  margin-left: var(--margin-offset);
}
</style>
</head>
<body>
  <div class="honeycomb">
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
  </div>
</body>
</html>
